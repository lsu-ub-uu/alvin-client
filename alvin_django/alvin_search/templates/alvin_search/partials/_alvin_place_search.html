{% load i18n static %}
<a class="group flex items-center gap-x-3 p-4 bg-gray-100/60 dark:bg-white/5 hover:bg-gray-200/80 dark:hover:bg-white/10 border border-[#D1D9D5] dark:border-white/10 rounded-md shadow-sm transition ease-in-out duration-150 no-underline text-[#333333] dark:text-off-white focus:outline-none focus:ring-2 focus:ring-dark-alvin"
   href="{% url 'alvin_viewer' 'alvin-place' record.identifier %}?data={{ encoded_link }}">
    <span class="shrink-0 text-gray-700 dark:text-gray-300 group-hover:text-dark-alvin dark:group-hover:text-light-alvin transition-colors">
        <svg class="size-6" aria-label="{% translate 'Plats' %}" viewBox="0 0 24 24" stroke-width="2" fill="none">
            {% include '../../alvin_viewer/_icons/place.svg' %}
        </svg>
    </span>
    <div class="flex flex-col font-semibold text-base group-hover:underline leading-snug {% if view == 'grid' %}text-sm{% endif %}">
        <h3>{{ record.title }}</h3>
        {% for entries in record.variants.names.values %}
        <p class="text-gray-500 dark:text-gray-400">{{ entries.display_without_variant }}</p>
        {% endfor %}
    </div>
</a>
