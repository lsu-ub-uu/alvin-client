{% load i18n static %}
<a {% if record.orientationCode == "rtl" %}dir="rtl"{% endif %}
   class="group flex items-center gap-x-3 p-4 bg-gray-100/60 dark:bg-white/5 hover:bg-gray-200/80 dark:hover:bg-white/10 border border-[#D1D9D5] dark:border-white/10 rounded-md shadow-sm transition ease-in-out duration-150 no-underline text-[#333333] dark:text-off-white focus:outline-none focus:ring-2 focus:ring-dark-alvin"
   href="{% url 'alvin_viewer' 'alvin-work' record.identifier %}?data={{ encoded_link }}">
    <span class="shrink-0 text-gray-700 dark:text-gray-300 group-hover:text-dark-alvin dark:group-hover:text-light-alvin transition-colors">
        <svg class="size-6" aria-label="{% translate 'Verk' %}" viewBox="0 0 24 24" stroke-width="2" fill="none">
            {% include '../../alvin_viewer/_icons/work.svg' %}
        </svg>
    </span>
    <div class="font-semibold text-base group-hover:underline leading-snug {% if view == 'grid' %}text-sm{% endif %}">
        {{ record.title|truncatechars:100 }}
    </div>
</a>
