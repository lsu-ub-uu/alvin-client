{% load i18n static %}

<div class="flex flex-col gap-y-1.5">
  <label for="{{ name }}" class="text-xs uppercase font-semibold tracking-wide text-gray-700 dark:text-gray-300">
    {% translate label %}
  </label>
  <select id="{{ name }}"
          name="{{ name }}"
          class="bg-white dark:bg-gray-800 text-[#333333] dark:text-off-white p-2 w-full rounded-md text-sm border border-[#D1D9D5] dark:border-white/15 shadow-sm focus:outline-none focus:ring-2 focus:ring-dark-alvin dark:focus:ring-light-alvin transition ease-in-out duration-150">
    <option value="" class="text-gray-400">{% translate 'Välj' %}</option>
    {% for key, display_label in options.items %}
      <option value="{{ key }}" {% if request_value == key %}selected{% endif %}>
        {{ display_label }}
      </option>
    {% endfor %}
  </select>
</div>
