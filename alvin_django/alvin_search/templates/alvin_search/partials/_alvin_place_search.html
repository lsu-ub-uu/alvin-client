{% load i18n static %}
<a class="flex items-center border-2 border-blue-200 shadow-md shadow-blue-200/70 hover:shadow-lg/100 mt-4 p-4 bg-white dark:bg-gray-800 rounded block px-4 py-2 mt-2 text-sm font-normal text-gray-900 rounded-lg focus:outline-none focus:shadow-outline" href="{% url 'alvin_viewer' 'alvin-place' record.identifier %}?data={{ encoded_link }}">
    <svg class="size-6" aria-label="Plats (alvin-place)" viewBox="0 0 24 24" stroke-width="2" fill="none">
        {% include '../../alvin_viewer/_icons/place.svg' %}
    </svg>
    <div class="py-2 px-2 font-semibold text-blue-800 dark:text-blue-200 underline text-base {% if view == 'grid' %}md:w-42 md:text-sm{% endif %}">
        {{record.nameone}}
        {% if record.nametwo != None %}
            ; {{record.nametwo}} 
        {% endif %}
        {% if record.namethree != None %}
            ; {{record.namethree}} 
        {% endif %}
    </div>
</a>
