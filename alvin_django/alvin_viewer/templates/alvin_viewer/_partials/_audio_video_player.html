{% load i18n static %}

<aside class="flex flex-col gap-y-4 mx-auto w-full max-w-4xl mt-5">
    <h3 class="text-2xl font-bold">Media</h3>
    <div class="flex flex-col gap-y-4">
        {% for av in metadata.files.get_audio_video %}
        <div class="w-full">
            {% if av.master_type|first in 'audio' %}
            <audio controls class="w-full">
                <source src="{{ av.master_url }}" type="{{ av.mime_type }}">
                {% translate 'Din webbläsare stödjer inte audio elementet.' %}
            </audio>
            {% elif av.master_type|first in 'video' %}
            <video controls class="flex-1 rounded-md">
                <source src="{{ av.master_url }}" type="{{ av.mime_type }}">
                {% translate 'Din webbläsare stödjer inte video elementet.' %}
            </video>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</aside>
