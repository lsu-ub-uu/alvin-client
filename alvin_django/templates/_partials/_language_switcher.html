{% load i18n static %}
{% get_current_language as current_language %}
{% get_available_languages as LANGUAGES %}


<div class="flex flex-col md:flex-row md:w-1/3">
    <div class="mx-auto flex justify-between content-center items-center gap-x-1">
        
        <!-- Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="currentColor" class="size-6 text-black dark:text-white" aria-hidden="true">
            <title>{% translate 'Byt språk' %}</title>
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
        </svg>

        <!-- Form -->
        <form method="post" action="{% url 'set_language' %}" class="m-0"> 
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.build_absolute_uri|cut:'en/' |cut:'no/' |cut:'sv/' }}">
            
            <div class="inline-flex shrink-0 p-1 bg-gray-100 dark:bg-gray-900 border border-[#D1D9D5] dark:border-white/10 rounded-full" role="group" aria-label="{% translate 'Välj språk' %}">
                
                {% for lang in LANGUAGES %}
                <button type="submit" name="language" value="{{ lang.0 }}"
                        class="px-2 py-1.5 text-xs rounded-full transition-all duration-150 cursor-pointer overflow-hidden uppercase
                        {% if current_language == lang.0 %}
                            bg-white dark:bg-gray-800 text-dark-alvin dark:text-light-alvin shadow-xs font-semibold
                        {% else %}
                            text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:text-off-white active:bg-gray-200 dark:active:text-off-white active:scale-[0.98] font-normal
                        {% endif %}">
                    {{ lang.0 }}
                </button>
                {% endfor %}

            </div>
        </form>
    </div>
</div>
