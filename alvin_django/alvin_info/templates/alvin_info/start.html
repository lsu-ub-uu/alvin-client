{% extends "master.html" %}
{% load static i18n %}

{% block title %}
Alvin - {% translate 'Startsida' %}
{% endblock %}

{% block content %}
<span id="main-content-marker" class="sr-only"></span>

<main class="relative isolate flex flex-col h-[calc(100dvh-4rem)] w-full bg-dark-alvin overflow-hidden">
    
    <img src="{% static hero_bg.file %}"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
        onload="this.classList.remove('opacity-0'); this.classList.add('opacity-100')"
        class="absolute inset-0 -z-20 h-full w-full object-cover object-center pointer-events-none select-none transition-opacity duration-1000 ease-out opacity-0">

    <div aria-hidden="true" class="absolute inset-0 -z-10 bg-black/30 dark:bg-black/50 pointer-events-none"></div>

    <div class="relative z-10 flex flex-col justify-center items-center flex-1 w-full px-4 gap-y-8">
        
        <h1 class="text-off-white text-center text-3xl md:text-4xl lg:text-5xl font-bold tracking-tight drop-shadow-lg max-w-5xl">
            {% translate 'Nordisk plattform för digitaliserat kulturarv' %}
        </h1>
        
        <div class="w-full flex justify-center">
            {% include "./start_search.html" %}
        </div>
    </div>

    <a href="{{ hero_bg.url }}"
       class="absolute bottom-5 left-5 z-20 flex items-center gap-x-1.5 text-xs text-white/80 hover:text-white active:text-white transition-colors duration-150 drop-shadow-md no-underline focus:outline-none focus:underline"
       title="{% translate 'Om bakgrundsbilden: ' %}{{ hero_bg.title }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4 shrink-0" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z" clip-rule="evenodd" />
        </svg>
        <span class="font-medium tracking-wide">{{ hero_bg.title }}</span>
    </a>
    
</main>
{% endblock %}
