{% load i18n %}
<div class="p-6">
    <form class="flex flex-col items-center justify-center" action="{% url 'alvin_search'%}" method="get" role="search">
        <div class="bg-gray-50 dark:bg-gray-900  border-2 border-black dark:border-gray-200 z-10 mb-5 flex w-full md:w-2/3 lg:1/2 rounded-full p-2 shadow-md">
            <label for="alvinsearch" class="sr-only">{% translate 'Sök' %}</label>
            <input name="query" id="alvinsearch" x-ref="alvinsearch" class="w-full rounded-full bg-gray-50 py-4 pl-6 text-sm leading-tight text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-blue-400 lg:text-base"
                type="search" placeholder="{% translate 'Sök över en halv miljon objekt' %}"
                {% if query %}
                value="{{ query }}"
                {% endif %}>
            <button type="submit" class="mx-2 rounded-full bg-gray-900 dark:bg-gray-500 p-4 text-white hover:bg-dark-alvin focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-blue-400">
                <span class="sr-only">{% translate 'Sök' %}</span>
                <svg class="size-6" viewBox="0 0 20 20"
                    fill="currentColor" aria-hidden="true">
                    <title>{% translate 'Knapp för sökning' %}</title>
                    <path fill-rule="evenodd"
                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                        clip-rule="evenodd"/>
                </svg>
            </button>
        </div>
        <fieldset class="flex flex-wrap justify-center gap-2 text-sm bg-gray-50 dark:bg-gray-900 border-2 border-black dark:border-gray-200 p-2 rounded-full shadow-md">
            <legend class="sr-only">{% translate 'Söktyp' %}</legend>
            
            {% for key, label, icon_path in search_types %}
            <div>
                <input type="radio" id="{{ key }}" name="searchType" value="{{ key }}"
                    {% if searchType == key or not searchType and forloop.first %} checked {% endif %}
                    class="peer sr-only" aria-label="{{ label }}">
                <label for="{{ key }}" class="search-type-radio">
                    <svg class="size-6" stroke-width="2" fill="none" aria-hidden="true">
                        {% include icon_path %}
                    </svg>
                    <span class="select-none max-sm:hidden">{{ label }}</span>
                </label>
            </div>
            {% endfor %}
        </fieldset>
        <input type="hidden" name="view" value="list">
    </form>
</div>
