{% load i18n static %}

<a class="group flex items-center gap-x-3 p-4 bg-gray-100/60 dark:bg-white/5 hover:bg-gray-200/80 dark:hover:bg-white/10 active:bg-gray-200/80 dark:active:bg-white/10 border border-[#D1D9D5] dark:border-white/10 rounded-md shadow-sm transition ease-in-out duration-150 no-underline text-[#333333] dark:text-off-white"
   href="{% url 'alvin_viewer' 'alvin-place' record.identifier %}?data={{ encoded_link }}">
    <span class="shrink-0 text-gray-700 dark:text-gray-300 group-hover:text-dark-alvin dark:group-hover:text-light-alvin group-active:text-dark-alvin dark:group-active:text-light-alvin transition-colors">
        <svg class="size-6" aria-label="{% translate 'Place' %}" viewBox="0 0 24 24" stroke-width="2" fill="none">
            {% include '_icons/place.svg' %}
        </svg>
    </span>
    <div class="flex flex-col font-semibold text-base leading-snug {% if view == 'grid' %}text-sm{% endif %}">
        
        <!-- Names -->
        <h3>{{ record.title }}</h3>
        {% for entries in record.variants.names.values %}
        <p class="text-gray-500 dark:text-gray-400">{{ entries.display_without_variant }}</p>
        {% endfor %}
        
        <!-- Country -->
        {% if record.country %}
        <div class="text-sm text-gray-600 dark:text-gray-400 pt-1">
            <p>{{ record.country }}</p>
        </div>
        {% endif %}

    </div>
</a>
