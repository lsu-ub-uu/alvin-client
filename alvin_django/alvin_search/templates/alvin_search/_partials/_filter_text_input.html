{% load i18n static %}

<div class="flex flex-col gap-y-1.5">
  <label for="{{ name }}" class="text-xs uppercase font-semibold tracking-wide text-gray-700 dark:text-gray-300">
    {% translate label %}
  </label>
  <input type="text"
         id="{{ name }}"
         name="{{ name }}"
         value="{{ value }}"
         {% if placeholder %}placeholder="{% translate placeholder %}"{% endif %}
         class="bg-white dark:bg-white/5 text-[#333333] dark:text-off-white placeholder:text-gray-400 p-2 w-full rounded-md text-sm border border-[#D1D9D5] dark:border-white/15 shadow-sm focus:outline-none focus:ring-2 focus:ring-dark-alvin dark:focus:ring-light-alvin transition ease-in-out duration-150">
</div>
