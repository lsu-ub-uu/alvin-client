{% load i18n static %}
 
<div class="md-toggle-closed" data-xbind:class="{ 'md-toggle-open': details }">
    <button data-xon.click="details = !details">
        {% include '../_icons/allmetadata.svg' with class="size-6" %}
        <span>{% translate 'Detaljer' %}</span>
        <svg 
            class="size-6 inline-block transition-transform duration-100 ease-in-out origin-center" 
            data-xbind:class="details ? 'rotate-90' : 'rotate-0'"
            stroke-width="2" 
            viewBox="0 0 24 24" 
            fill="none" 
            color="currentColor"
            >
            <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </button>
</div>
