<button 
    data-xdata="{ show: false }"
    data-xon.scroll.window="show = window.scrollY > 20"
    data-xon.click="window.scrollTo({ top: 0, behavior: 'smooth' })"
    data-xshow="show"
    data-xtransition.opacity.duration.300ms
    style="display: none;"
    class="fixed bottom-4 right-4 inline-flex items-center p-1 bg-gray-200 dark:bg-white/10 hover:bg-alvin-orange hover:text-white active:bg-alvin-orange active:text-white active:scale-[0.98] text-[#333333] dark:text-off-white rounded-full shadow-sm border border-[#D1D9D5] dark:border-white/15 transition-colors duration-150 focus:outline-none cursor-pointer z-50"
    aria-label="Tillbaka till toppen"
>
    <!-- Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
</button>
